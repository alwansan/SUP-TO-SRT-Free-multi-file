name: SUP → SRT

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Temporary job ID
        required: true
        type: string
      clean:
        description: Clean SRT
        required: true
        type: string
      remove_sounds:
        description: Remove bracketed sound/effect descriptions
        required: true
        type: string
      remove_names:
        description: Remove character names at the beginning
        required: true
        type: string
      remove_duplicates:
        description: Remove exact duplicate consecutive subtitles
        required: true
        type: string
      fix_ocr:
        description: Conservative OCR fixes
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: subtitle-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  convert:
    name: OCR and clean
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout temporary job branch
        uses: actions/checkout@v4
        with:
          ref: jobs/${{ inputs.job_id }}

      - name: Install Tesseract
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng git zip
          tesseract --version

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and publish official Subtitle Edit seconv
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/subtitleedit /opt/subtitleedit
          git clone --depth 1 https://github.com/SubtitleEdit/subtitleedit.git /tmp/subtitleedit
          cd /tmp/subtitleedit

          echo "Subtitle Edit commit:"
          git rev-parse HEAD
          echo "seconv target framework:"
          grep -n 'TargetFramework' src/seconv/SeConv.csproj

          dotnet restore src/seconv/SeConv.csproj
          dotnet publish src/seconv/SeConv.csproj             -c Release             -r linux-x64             --self-contained false             -o /opt/subtitleedit

          test -x /opt/subtitleedit/seconv
          chmod +x /opt/subtitleedit/seconv
          /opt/subtitleedit/seconv --version
          /opt/subtitleedit/seconv list-ocr-engines || true

          echo "SECONV=/opt/subtitleedit/seconv" >> "$GITHUB_ENV"

      - name: Prepare directories
        run: |
          set -e
          rm -rf output
          mkdir -p output
          find "jobs/${{ inputs.job_id }}" -type f -iname '*.sup' -printf '%p %s bytes
' | sort

      - name: Convert SUP → SRT sequentially
        shell: bash
        run: |
          set -uo pipefail

          JOB="jobs/${{ inputs.job_id }}"
          total=$(find "$JOB" -type f -iname '*.sup' | wc -l)
          done=0
          success=0
          failed=0

          echo "=========================================="
          echo "SUP → SRT"
          echo "Total SUP files: $total"
          echo "Processing sequentially"
          echo "=========================================="

          if [ "$total" -eq 0 ]; then
            echo "ERROR: No SUP files found."
            exit 1
          fi

          while IFS= read -r -d '' sup; do
            done=$((done + 1))
            base="$(basename "$sup")"

            echo ""
            echo "=========================================="
            echo "[$done/$total] $base"
            echo "=========================================="

            if "$SECONV" "$sup" subrip               --ocr-engine:tesseract               --ocr-language:eng               --output-folder:output               --overwrite
            then
              echo "SUCCESS: $base"
              success=$((success + 1))
            else
              echo "FAILED: $base"
              failed=$((failed + 1))
            fi
          done < <(find "$JOB" -type f -iname '*.sup' -print0 | sort -z)

          echo "=========================================="
          echo "CONVERSION SUMMARY"
          echo "Total:      $total"
          echo "Successful: $success"
          echo "Failed:     $failed"
          echo "=========================================="

          if [ "$success" -eq 0 ]; then
            echo "ERROR: No files were converted."
            exit 1
          fi

      - name: Clean SRT files
        if: ${{ inputs.clean == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(output/*.srt)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: No SRT files were generated."
            exit 1
          fi

          for f in "${files[@]}"; do
            echo "Cleaning: $(basename "$f")"
            python3 tools/clean_srt.py "$f"               --remove-sounds "${{ inputs.remove_sounds }}"               --remove-names "${{ inputs.remove_names }}"               --remove-duplicates "${{ inputs.remove_duplicates }}"               --fix-ocr "${{ inputs.fix_ocr }}"
          done

      - name: Show output
        run: |
          find output -type f -name '*.srt' -printf '%f %s bytes
' | sort

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd output
          shopt -s nullglob
          files=(*.srt)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: No SRT files found."
            exit 1
          fi
          zip -0 -q ../SUP_TO_SRT_results.zip "${files[@]}"
          cd ..
          ls -lh SUP_TO_SRT_results.zip

      - name: Upload result ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SUP_TO_SRT_results
          path: SUP_TO_SRT_results.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Cleanup temporary job branch
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api             --method DELETE             "repos/${{ github.repository }}/git/refs/heads/jobs/${{ inputs.job_id }}"             || true
